---
name: Wireless Flex Profile
path: /Cisco-IOS-XE-wireless-flex-cfg:flex-cfg-data/flex-policy-entries/flex-policy-entry[policy-name=%s]
no_delete_attributes: true
no_augment_config: true
doc_category: Wireless
attributes:
  - yang_name: policy-name
    tf_name: name
    type: String
    id: true
    example: S1-BRANCH-FLEX
  - yang_name: description
    tf_name: description
    type: String
    example: Branch FlexConnect profile
  - yang_name: native-vlan-id
    tf_name: native_vlan_id
    type: Int64
    example: 10
  - yang_name: arp-caching
    tf_name: arp_caching
    type: Bool
    example: false
  - yang_name: fallback-radio-shut
    tf_name: fallback_radio_shut
    type: Bool
    example: true
  - yang_name: efficient-ap-upgrade-enable
    tf_name: efficient_image_upgrade
    type: Bool
    example: false
  - yang_name: if-name-vlan-ids/if-name-vlan-id
    tf_name: vlan_names
    type: List
    attributes:
      - yang_name: interface-name
        tf_name: name
        type: String
        id: true
        example: data
      - yang_name: vlan-id
        tf_name: vlan_id
        type: Int64
        example: 20
  - yang_name: policy-acls/policy-acl
    tf_name: acl_policies
    type: List
    attributes:
      - yang_name: acl-name
        tf_name: name
        type: String
        id: true
        example: S1-FLEX-ACL
